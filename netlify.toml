[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# BrowserRouter uses real client-side paths (e.g. /tasks/kanban,
# /clients/:id) - without this, a hard refresh or a shared link on any
# route but "/" hits Netlify's static 404 instead of the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
